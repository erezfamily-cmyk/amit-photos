# PayPal Sandbox staging only.
# Isolated from production. No custom routes and no cron triggers.

name = "amit-photos-paypal-sandbox"
main = "worker.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

[vars]
PAYMENTS_ENABLED = "true"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "amit-photos-paypal-sandbox-db"
database_id = "7b027b93-c548-4ceb-bbe9-42c45264fc23"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "amit-photos-paypal-sandbox-images"

[images]
binding = "IMAGES"

# Intentionally no [[routes]] and no [triggers].
