<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f1e9;--surface:#fffdf9;--surface2:#f0ebe0;--border:#ded8ce;--accent:#7a5c3f;--text:#302d28;--muted:#645f57;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;padding:0 0 4rem}
.spot-hero{padding:2.5rem 1.25rem 1.5rem;max-width:800px;margin:0 auto}
.back-link{font-size:.85rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1.5rem;transition:color .2s}
.back-link:hover{color:var(--accent)}
.badge{display:inline-block;font-size:.72rem;background:rgba(122,92,63,.12);border:1px solid rgba(122,92,63,.3);color:var(--accent);border-radius:20px;padding:.3rem .8rem;margin-bottom:.75rem}
h1{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:500;font-size:2rem;color:var(--accent);margin-bottom:.5rem}
.region-time{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
.map-wrap{margin:0 auto 2rem;max-width:800px;padding:0 1.25rem}
.map-wrap iframe{width:100%;height:300px;border:0;border-radius:8px}
.section{max-width:800px;margin:0 auto 2rem;padding:0 1.25rem}
.section h2{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:500;font-size:1.1rem;color:var(--accent);margin-bottom:.75rem}
.tip-box{background:var(--surface2);border:1px solid rgba(122,92,63,.2);border-radius:8px;padding:1.25rem;font-size:.9rem;line-height:1.7;color:var(--text)}
.specs-list{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.specs-list li{font-size:.9rem;color:var(--muted)}
.specs-list li strong{color:var(--text)}
.guides-row{display:flex;flex-wrap:wrap;gap:.5rem}
.guide-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:.35rem .9rem;font-size:.8rem;color:var(--muted);text-decoration:none;transition:all .2s}
.guide-chip:hover{border-color:var(--accent);color:var(--accent)}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(min-width:600px){.gallery-grid{grid-template-columns:repeat(3,1fr)}}
.gallery-item{border-radius:6px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.gallery-item .photo-wrap{aspect-ratio:3/2;overflow:hidden}
.gallery-item .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.gallery-item:hover .photo-wrap img{transform:scale(1.04)}
.photo-btns{display:flex;gap:.4rem;padding:.5rem;justify-content:center}
.btn-gallery{flex:1;text-align:center;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:.35rem .5rem;font-size:.75rem;font-family:'Heebo',sans-serif;text-decoration:none;transition:all .2s}
.btn-gallery:hover{border-color:var(--accent);color:var(--accent)}
.btn-sale{flex:1;text-align:center;background:var(--accent);color:#fffdf9;border:none;border-radius:4px;padding:.35rem .5rem;font-size:.75rem;font-weight:700;font-family:'Heebo',sans-serif;text-decoration:none;transition:opacity .2s}
.btn-sale:hover{opacity:.85}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:3000;display:none;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:88vh;border-radius:4px;object-fit:contain}
.lb-close{position:absolute;top:1rem;left:1rem;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:.5rem}
.suggest-link{text-align:center;padding:1.5rem;color:var(--muted);font-size:.85rem}
.suggest-link button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;text-decoration:underline;font-family:'Heebo',sans-serif}
.modal-overlay{position:fixed;inset:0;background:rgba(40,32,20,.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:1.25rem}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;width:100%;max-width:460px}
.modal h2{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:500;color:var(--accent);margin-bottom:1.25rem}
.modal label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.3rem}
.modal input,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.65rem .9rem;border-radius:4px;font-size:.9rem;font-family:'Heebo',sans-serif;direction:rtl;margin-bottom:1rem;outline:none}
.modal input:focus,.modal textarea:focus{border-color:var(--accent)}
.modal textarea{min-height:100px;resize:vertical}
.modal-actions{display:flex;gap:.75rem;justify-content:flex-end}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.6rem 1.25rem;border-radius:4px;font-size:.85rem;cursor:pointer}
.btn-submit{background:var(--accent);color:#fffdf9;border:none;padding:.6rem 1.5rem;border-radius:4px;font-weight:700;font-size:.85rem;cursor:pointer}
.share-row { display:flex; gap:.6rem; flex-wrap:wrap; margin:1rem 0 1.5rem; }
.share-btn { display:flex; align-items:center; gap:.4rem; padding:.45rem .9rem; border-radius:20px; border:none; cursor:pointer; font-size:.8rem; font-family:'Heebo',sans-serif; font-weight:600; transition:opacity .2s; }
.share-btn:hover { opacity:.85; }
.share-wa { background:#0e7a3a; color:#fff; }
.share-fb { background:#1461cc; color:#fff; }
.share-copy { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
#waze-wrap { display:none; margin:.75rem 1.25rem; }
#waze-link { display:inline-flex; align-items:center; gap:.5rem; background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.55rem 1rem; color:var(--accent); text-decoration:none; font-size:.85rem; font-weight:600; }
#next-loc-nav { display:none; margin:2.5rem 1.25rem; padding:1.25rem 1.5rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; text-align:center; }
#next-loc-label { font-size:.78rem; color:var(--muted); margin-bottom:.4rem; }
#next-loc-link { color:var(--accent); text-decoration:none; font-size:1rem; font-weight:700; }
@media print {
  nav#main-nav, footer#main-footer, .share-row, #correction-modal, #correction-trigger { display:none !important; }
  body { background:#fff !important; color:#000 !important; }
}
/* when_to_visit */
.seasons-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.75rem 0}
.season-card{border-radius:6px;padding:.6rem .5rem;text-align:center;font-family:'Heebo',sans-serif}
.season-card.good{background:rgba(122,92,63,.18);border:1px solid rgba(122,92,63,.4)}
.season-card.ok{background:rgba(100,180,100,.1);border:1px solid rgba(100,180,100,.25)}
.season-card.bad{background:rgba(80,80,80,.12);border:1px solid var(--border)}
.season-card .s-emoji{font-size:1.1rem}
.season-card .s-name{font-size:.7rem;color:var(--text);margin:.2rem 0}
.season-card .s-note{font-size:.68rem;color:#4a463f;line-height:1.4}
.season-card.good .s-note{color:#5c4329}
/* recommended_gear */
.gear-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.gear-chip{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:.3rem .75rem;font-size:.78rem;color:var(--muted);font-family:'Heebo',sans-serif}
.gear-chip.primary{border-color:rgba(122,92,63,.5);color:var(--accent);font-weight:600}
/* nearby */
.nearby-list{display:flex;flex-direction:column;gap:.5rem;margin:.6rem 0}
.nearby-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .85rem;text-decoration:none;color:var(--text);transition:border-color .2s}
.nearby-item:hover{border-color:var(--accent)}
.nearby-name{font-size:.88rem}
.nearby-dist{font-size:.75rem;color:var(--muted)}
@media(max-width:480px){.seasons-grid{grid-template-columns:repeat(2,1fr)}}
.badge .gi,.share-btn .gi,#waze-link .gi,.kofi-bar .gi{vertical-align:-3px}
.sun-ico{display:inline-flex;vertical-align:middle;margin-inline-end:.35rem;color:var(--accent)}
#weather-icon{color:var(--accent);line-height:1}
#weather-wind{display:flex;align-items:center;gap:.3rem}
.season-card .s-emoji{color:var(--accent);line-height:1;display:flex;justify-content:center}
.kofi-bar{text-align:center;padding:1.5rem 1.25rem 2rem;border-top:1px solid var(--border);margin-top:1rem}
.kofi-bar a{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid rgba(122,92,63,.4);color:var(--accent);font-size:.82rem;font-weight:700;padding:.55rem 1.4rem;border-radius:8px;text-decoration:none;transition:background .2s,color .2s}
.kofi-bar a:hover{background:var(--accent);color:#fffdf9}
</style>
</head>

<script>
function escHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getLang() { return localStorage.getItem('lang') || 'he'; }

const REGION_MAP_EN = {
  'צפון': 'North', 'מרכז': 'Center', 'דרום': 'South',
  'ירושלים': 'Jerusalem', 'נגב': 'Negev', 'הרי אילת': 'Eilat Mountains',
  'עמק חפר — שרון': 'Sharon Valley', 'חול — אמירויות': 'UAE',
  'ישראל': 'Israel', 'איטליה': 'Italy', 'יוון': 'Greece', 'צרפת': 'France',
  'ספרד': 'Spain', 'פורטוגל': 'Portugal', 'גרמניה': 'Germany',
  'הולנד': 'Netherlands', 'אנגליה': 'England', 'יפן': 'Japan',
  'ארה"ב': 'USA', 'קנדה': 'Canada', 'מרוקו': 'Morocco', 'טורקיה': 'Turkey',
  'קרואטיה': 'Croatia', 'אוסטריה': 'Austria', 'תנזניה': 'Tanzania',
  'איחוד האמירויות': 'UAE'
};

const GUIDE_LABELS_EN = {
  '/camera/filters/': 'Filters',
  '/camera/composition/': 'Composition',
  '/camera/exposure/': 'Exposure',
  '/camera/depth-of-field/': 'Depth of Field',
  '/camera/white-balance/': 'White Balance',
  '/camera/histogram/': 'Histogram',
  '/camera/light/': 'Light & Color',
  '/camera/dynamic-range/': 'Dynamic Range',
  '/camera/controls/': 'Camera Controls',
  '/camera/lenses/': 'Lenses',
  '/camera/types/': 'Camera Types'
};

function renderText(s){
  if(!s) return '';
  return escHtml(s).replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    (_, text, url) => `<a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">${text}</a>`);
}

function shareWhatsApp() {
  window.open('https://wa.me/?text=' + encodeURIComponent(document.title + ' ' + location.href));
}
function shareFacebook() {
  window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(location.href));
}
function copyLink() {
  const L = SPOT_LABELS[getLang()] || SPOT_LABELS.he;
  navigator.clipboard.writeText(location.href).then(() => {
    const btn = document.getElementById('btn-copy-link');
    btn.textContent = L.copied;
    setTimeout(() => { btn.textContent = L.copyLink; }, 2000);
  });
}

async function loadNextLocation(currentSlug, currentRegion) {
  try {
    const res = await fetch('/api/locations?t=' + Date.now(), { cache: 'no-store' });
    const all = await res.json();
    const sameRegion = (Array.isArray(all) ? all : all.locations || [])
      .filter(l => l.region === currentRegion && l.id !== currentSlug);
    if (!sameRegion.length) return;
    const next = sameRegion[0];
    const isEn = getLang() === 'en';
    document.getElementById('next-loc-title').textContent = (isEn && next.title_en) ? next.title_en : next.title;
    document.getElementById('next-loc-link').href = '/locations/' + encodeURIComponent(next.id) + '/';
    document.getElementById('next-loc-nav').style.display = 'block';
  } catch(e) {}
}

function imgSrc(url, w) {
  if (!url) return '';
  if (url.includes('amitphotos.com/photos/') || url.startsWith('/photos/')) {
    return url + '?w=' + w;
  }
  return url;
}

const GUIDE_LABELS = {
  '/camera/filters/': 'פילטרים',
  '/camera/composition/': 'קומפוזיציה',
  '/camera/exposure/': 'חשיפה',
  '/camera/depth-of-field/': 'עומק שדה',
  '/camera/white-balance/': 'איזון לבן',
  '/camera/histogram/': 'היסטוגרם',
  '/camera/light/': 'אור',
  '/camera/dynamic-range/': 'דינמיק ריינג',
  '/camera/controls/': 'בקרות מצלמה',
  '/camera/lenses/': 'עדשות',
  '/camera/types/': 'סוגי מצלמות'
};

const params = new URLSearchParams(location.search);
let slug = params.get('slug');
if (!slug) {
  const pathMatch = location.pathname.match(/^\/locations\/([^/]+)\/?$/);
  if (pathMatch && pathMatch[1] !== 'spot') slug = pathMatch[1];
}

if (!slug) { location.href = '/locations/'; }

function setMeta(property, content) {
  let el = document.querySelector(`meta[property="${property}"]`) ||
           document.querySelector(`meta[name="${property}"]`);
  if (!el) {
    el = document.createElement('meta');
    const isOg = property.startsWith('og:') || property.startsWith('twitter:');
    el.setAttribute(isOg ? 'property' : 'name', property);
    document.head.appendChild(el);
  }
  el.setAttribute('content', content);
}

function setLocationMeta(loc, coverUrl) {
  setMeta('og:title', loc.title + ' | מקומות לצילום — עמית ארז');
  setMeta('twitter:title', loc.title + ' | מקומות לצילום');
  const desc = (loc.description || '').slice(0, 160);
  setMeta('og:description', desc);
  setMeta('twitter:description', desc);
  setMeta('description', desc);
  if (coverUrl) {
    setMeta('og:image', coverUrl);
    setMeta('twitter:image', coverUrl);
    setMeta('twitter:card', 'summary_large_image');
  }
  setMeta('og:url', location.href);
  document.title = loc.title + ' | מקומות לצילום — עמית ארז';
}

function setJsonLd(loc) {
  const coords = loc.coordinates ? loc.coordinates.split(',').map(s => s.trim()) : null;
  const ld = {
    '@context': 'https://schema.org',
    '@type': 'TouristAttraction',
    'name': loc.title,
    'description': loc.description || '',
    'url': location.href,
    'address': {
      '@type': 'PostalAddress',
      'addressCountry': 'IL',
      'addressRegion': loc.region || ''
    }
  };
  if (coords && coords.length === 2) {
    ld['geo'] = {
      '@type': 'GeoCoordinates',
      'latitude': coords[0],
      'longitude': coords[1]
    };
  }
  let script = document.getElementById('location-jsonld');
  if (!script) {
    script = document.createElement('script');
    script.id = 'location-jsonld';
    script.type = 'application/ld+json';
    document.head.appendChild(script);
  }
  script.textContent = JSON.stringify(ld);
}

async function loadSpot() {
  const lang = getLang();
  const isEn = lang === 'en';
  document.documentElement.dir = isEn ? 'ltr' : 'rtl';
  document.documentElement.lang = lang;
  document.body.style.direction = isEn ? 'ltr' : 'rtl';
  document.body.style.fontFamily = isEn ? "'Inter', system-ui, sans-serif" : '';

  const backLink = document.querySelector('.back-link');
  if (backLink) backLink.textContent = isEn ? '← Back to Locations' : '← חזרה למקומות';
  const corrBtn = document.getElementById('btn-open-correction');
  if (corrBtn) corrBtn.textContent = isEn ? 'Have a tip or correction? Let me know' : 'יש לך טיפ או תיקון? שלח לי';

  try {
    const res = await fetch(`/api/locations/${slug}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) { location.href = '/locations/'; return; }
    const loc = await res.json();
    renderSpot(loc, lang);
    const coverUrl = (loc.photos && loc.photos.length) ? (loc.photos[0].url || '') : '';
    setLocationMeta(loc, coverUrl);
    setJsonLd(loc);
    loadNextLocation(slug, loc.region);
  } catch {
    document.getElementById('hero-content').innerHTML = '<p style="color:var(--muted)">שגיאה בטעינה.</p>';
  }
}

window.addEventListener('storage', (e) => {
  if (e.key === 'lang') { loadSpot(); applySpotModalLang(); }
});

function renderSeasons(wt, lang) {
  if (!wt) return '';
  const isEn = lang === 'en';
  const SEASONS = [
    { key: 'summer', label: isEn ? 'Summer' : 'קיץ',  icon: ICONS.summer },
    { key: 'fall',   label: isEn ? 'Autumn' : 'סתיו', icon: ICONS.fall },
    { key: 'winter', label: isEn ? 'Winter' : 'חורף', icon: ICONS.winter },
    { key: 'spring', label: isEn ? 'Spring' : 'אביב', icon: ICONS.spring }
  ];
  const heading = isEn ? 'When to Visit' : 'מתי לבוא';
  const cards = SEASONS.map(s => {
    const d = wt[s.key] || {};
    const cls = d.rating === 'good' ? 'good' : d.rating === 'bad' ? 'bad' : 'ok';
    return `<div class="season-card ${cls}">
      <div class="s-emoji">${s.icon}</div>
      <div class="s-name">${s.label}</div>
      <div class="s-note">${escHtml(d.note || '')}</div>
    </div>`;
  }).join('');
  return `<div class="section"><h2>${heading}</h2><div class="seasons-grid">${cards}</div></div>`;
}

function renderGear(gear, lang) {
  if (!gear || !gear.length) return '';
  const heading = lang === 'en' ? 'Recommended Gear' : 'ציוד מומלץ';
  const chips = gear.map(g => {
    const cls = g.primary ? 'gear-chip primary' : 'gear-chip';
    return `<span class="${cls}">${escHtml(g.name)}</span>`;
  }).join('');
  return `<div class="section"><h2>${heading}</h2><div class="gear-chips">${chips}</div></div>`;
}

function renderNearby(nearby, lang) {
  if (!nearby || !nearby.length) return '';
  const isEn = lang === 'en';
  const heading = isEn ? 'Nearby Spots' : 'מקומות קרובים';
  const kmLabel = isEn ? 'km →' : 'ק"מ →';
  const items = nearby.map(n =>
    `<a class="nearby-item" href="/locations/${encodeURIComponent(n.id)}/">
      <span class="nearby-name">${escHtml((isEn && n.title_en) ? n.title_en : n.title)}</span>
      <span class="nearby-dist">${n.km} ${kmLabel}</span>
    </a>`
  ).join('');
  return `<div class="section"><h2>${heading}</h2><div class="nearby-list">${items}</div></div>`;
}

const WMO_HE = {
  0:'clear בהיר', 1:'partly בהיר ברובו', 2:'partly מעונן חלקית', 3:'cloud מעונן',
  45:'fog ערפל', 48:'fog ערפל קרח',
  51:'drizzle טפטוף קל', 53:'drizzle טפטוף', 55:'rain טפטוף כבד',
  61:'rain גשם קל', 63:'rain גשם', 65:'rain גשם כבד',
  71:'snow שלג קל', 73:'snow שלג', 75:'snow שלג כבד',
  80:'drizzle מקלחות קלות', 81:'rain מקלחות', 82:'storm מקלחות כבדות',
  95:'storm סופת רעמים', 99:'storm סופה עם ברד'
};
const WMO_EN = {
  0:'clear Clear', 1:'partly Mostly Clear', 2:'partly Partly Cloudy', 3:'cloud Overcast',
  45:'fog Foggy', 48:'fog Icy Fog',
  51:'drizzle Light Drizzle', 53:'drizzle Drizzle', 55:'rain Heavy Drizzle',
  61:'rain Light Rain', 63:'rain Rain', 65:'rain Heavy Rain',
  71:'snow Light Snow', 73:'snow Snow', 75:'snow Heavy Snow',
  80:'drizzle Light Showers', 81:'rain Showers', 82:'storm Heavy Showers',
  95:'storm Thunderstorm', 99:'storm Storm with Hail'
};
function getWMO(code) {
  return getLang() === 'en' ? (WMO_EN[code] || 'thermo --') : (WMO_HE[code] || 'thermo --');
}

async function loadSunTimes(lat, lng) {
  try {
    const res = await fetch(`https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&formatted=0`);
    const data = await res.json();
    if (data.status !== 'OK') return;

    function toLocalTime(utcStr) {
      const d = new Date(utcStr);
      return d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jerusalem' });
    }

    const sunriseTime = new Date(data.results.sunrise);
    const goldenHour = new Date(sunriseTime.getTime() + 60 * 60 * 1000);

    document.getElementById('sun-rise').textContent = toLocalTime(data.results.sunrise);
    document.getElementById('sun-set').textContent = toLocalTime(data.results.sunset);
    document.getElementById('golden-hour').textContent = toLocalTime(goldenHour.toISOString());
    document.getElementById('sun-widget').style.display = 'block';
  } catch(e) {}
}

async function loadWeather(lat, lng) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weathercode,windspeed_10m&timezone=Asia/Jerusalem`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    if (!c) return;

    const wmoEntry = getWMO(c.weathercode);
    const [kind, ...descParts] = wmoEntry.split(' ');
    document.getElementById('weather-icon').innerHTML = WX_ICONS[kind] || WX_ICONS.thermo;
    document.getElementById('weather-temp').textContent = Math.round(c.temperature_2m) + '°C';
    document.getElementById('weather-desc').textContent = descParts.join(' ');
    const windUnit = getLang() === 'en' ? 'km/h' : 'קמ"ש';
    document.getElementById('weather-wind').innerHTML = `<svg class="gi" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></svg><span>${Math.round(c.windspeed_10m)} ${windUnit}</span>`;
    document.getElementById('weather-widget').style.display = 'block';
  } catch(e) {}
}

loadSpot();
applySpotModalLang();

  <script>
  (function(){
    if (localStorage.getItem('pdfPopupSeen')) return;
    var shown = false;
    function showPdfPopup() {
      if (shown) return;
      shown = true;
      var el = document.getElementById('pdf-popup');
      el.style.display = 'flex';
    }
    document.addEventListener('mouseleave', function(e) {
      if (e.clientY < 10) showPdfPopup();
    });
    setTimeout(showPdfPopup, 30000);
  })();

  function closePdfPopup() {
    document.getElementById('pdf-popup').style.display = 'none';
    localStorage.setItem('pdfPopupSeen', '1');
  }

  document.getElementById('popup-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var email = document.getElementById('popup-email').value.trim();
    var btn = document.getElementById('popup-btn');
    var msg = document.getElementById('popup-msg');
    btn.disabled = true; btn.textContent = '...';
    try {
      var r = await fetch('/api/subscribers?source=popup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          consent_privacy: document.getElementById('popup-consent-privacy').checked,
          consent_marketing: document.getElementById('popup-consent-marketing').checked
        })
      });
      if (r.ok) {
        msg.style.color = '#2a7049';
        msg.textContent = '✓ נשלח! בדוק תיבת הדואר (גם spam).';
        document.getElementById('popup-email').value = '';
        btn.textContent = 'נשלח ✓';
        localStorage.setItem('pdfPopupSeen', '1');
      } else {
        msg.style.color = '#a8322a';
        msg.textContent = 'שגיאה. נסה שוב.';
        btn.disabled = false; btn.textContent = 'שלח לי ←';
      }
    } catch {
      msg.style.color = '#a8322a';
      msg.textContent = 'שגיאת רשת.';
      btn.disabled = false; btn.textContent = 'שלח לי ←';
    }
  });
  </script>
