name = "amit-photos"
main = "worker.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[vars]
# Temporary payments lockdown while migrating PayPal to Orders API v2.
# Flip to "true" once the new integration is verified end-to-end.
PAYMENTS_ENABLED = "false"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "amit-photos-db"
database_id = "802379c7-97cf-4262-93b8-da81c5c3c07d"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "amit-photos-images"

[images]
binding = "IMAGES"

[[routes]]
pattern = "www.amitphotos.com/*"
zone_name = "amitphotos.com"

[triggers]
crons = ["0 */2 * * *", "0 9 1,15 * *"]

# Preview deployments do not inherit production Worker bindings.
# This applies ONLY to Cloudflare Worker Previews; no production Service Binding.
# Read-only public GET is further restricted to Sandbox Preview host in worker.js.
[[previews.services]]
binding = "PUBLIC_GALLERY_SERVICE"
service = "amit-photos"

# Explicitly keep all real payments disabled in Preview as well.
[previews.vars]
PAYMENTS_ENABLED = "false"
