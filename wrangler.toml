name = "amit-photos"
main = "worker.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[vars]
# Temporary payments lockdown while migrating PayPal to Orders API v2.
# Flip to "true" once the new integration is verified end-to-end.
PAYMENTS_ENABLED = "false"
DIGITAL_PAYPAL_ENABLED = "false"

# Payment alerts (read-only monitoring + e-mail notices). Prepared for review: takes effect only when
# this change is merged and deployed. Alerts go by e-mail only (the Telegram secret also serves
# purchase notices and its receipt is unverified) to a DEDICATED recipient, so the site's other admin
# mail (ADMIN_EMAIL) is not redirected. Secrets (the mail and Telegram keys) are never defined here.
# To switch the alerts off again: revert this change (see docs/payment-alerts-cron-config-review-2026-10-14.md).
PAYMENT_ALERTS_ENABLED = "true"
PAYMENT_ALERT_CHANNELS = "email"
PAYMENT_ALERT_EMAIL = "erez.family@gmail.com"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "amit-photos-db"
database_id = "802379c7-97cf-4262-93b8-da81c5c3c07d"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "amit-photos-images"

[images]
binding = "IMAGES"

[[routes]]
pattern = "www.amitphotos.com/*"
zone_name = "amitphotos.com"

[triggers]
# The first two keep their usual jobs; "*/15 * * * *" runs ONLY the payment health check (see scheduled-routing.js).
crons = ["0 */2 * * *", "0 9 1,15 * *", "*/15 * * * *"]

