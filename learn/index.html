<script>
(function () {
  function setLang(lang) {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.body.style.direction = lang === 'en' ? 'ltr' : 'rtl';
    localStorage.setItem('lang', lang);
    document.querySelectorAll('[data-he]').forEach(function (el) {
      el.textContent = lang === 'en' ? (el.dataset.en || el.dataset.he) : el.dataset.he;
    });
    if (typeof applyNavLang === 'function') applyNavLang(lang);
  }
  window.setLang = setLang;
  var lang = localStorage.getItem('lang') || 'he';
  setLang(lang);
  window.addEventListener('storage', function (e) {
    if (e.key === 'lang') setLang(e.newValue || 'he');
  });
})();
</script>
