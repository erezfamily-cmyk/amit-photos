# TEMPLATE ONLY — do not use for production.
# Copy to a temporary staging config and replace __STAGING_D1_DATABASE_ID__.

name = "amit-photos-paypal-sandbox"
main = "worker.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public checkout stays closed by default, even on Sandbox. Sandbox E2E runs
# through the admin-authenticated /api/admin/paypal/* routes, which work while
# this flag is "false". Do not set it to "true" here; enabling public Sandbox
# checkout is a deliberate, separate dashboard decision for this Worker only.
PAYMENTS_ENABLED = "false"
DIGITAL_PAYPAL_ENABLED = "false"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "amit-photos-paypal-sandbox-db"
database_id = "__STAGING_D1_DATABASE_ID__"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "amit-photos-paypal-sandbox-images"

[images]
binding = "IMAGES"

# Intentionally no [[routes]] and no [triggers].
# Staging must remain workers.dev-only with no cron jobs.

