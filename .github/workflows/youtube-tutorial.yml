name: YouTube Tutorial — Camera Guide to Video

on:
  # כל רביעי 10:00 UTC = 13:00 ישראל (נפרד מה-slideshow של ראשון)
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      guide:
        description: 'שם המדריך (למשל: depth-of-field) — ריק = הבא בתור'
        required: false
        default: ''
      replace_id:
        description: 'YouTube Video ID למחיקה לפני העלאה (למשל: j2VtQzl2_k4)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  youtube-tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: התקנת חבילות
        run: pip install requests google-api-python-client google-auth google-auth-oauthlib

      - name: יצירת סרטון הדרכה ופרסום ל-YouTube
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PYTHONUNBUFFERED: "1"
        run: |
          GUIDE="${{ github.event.inputs.guide }}"
          REPLACE="${{ github.event.inputs.replace_id }}"
          ARGS=""
          [ -n "$GUIDE" ] && ARGS="$GUIDE"
          [ -n "$REPLACE" ] && ARGS="$ARGS --replace $REPLACE"
          python src/youtube_tutorial.py $ARGS

      - name: שיתוף סרטון ברשתות חברתיות
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 << 'EOF'
          import json, subprocess, sys
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          try:
              videos = json.load(open("data/videos.json", encoding="utf-8"))
          except Exception as e:
              print(f"לא ניתן לקרוא videos.json: {e}")
              sys.exit(0)
          tutorials = [v for v in videos if v.get("type") == "tutorial" and v.get("id")]
          if not tutorials:
              print("אין מדריכים — מדלג")
              sys.exit(0)
          latest = tutorials[-1]
          if latest.get("date") != today:
              print(f"הסרטון האחרון ({latest.get('date')}) לא הועלה היום ({today}) — מדלג")
              sys.exit(0)
          vid_id = latest["id"]
          title = latest.get("title_en") or latest.get("title_he") or "Photography Tutorial"
          print(f"משתף: {vid_id} — {title}")
          subprocess.run(["python3", "src/share_youtube.py", vid_id, title], check=False)
          EOF

      - name: שמירת היסטוריה
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube_tutorials_posted.json || true
          git add data/videos.json || true
          git diff --cached --quiet || git commit -m "🤖 עדכון youtube_tutorials_posted.json + videos.json"
          git pull --rebase origin main
          git push
