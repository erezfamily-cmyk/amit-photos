name: Pinterest queue validation

on:
  pull_request:
    paths:
      - 'src/pinterest_post.py'
      - 'data/pinterest_queue.csv'
      - 'tests/test_pinterest_post.py'
      - '.github/workflows/pinterest-post.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p 'test_pinterest_post.py'
      - run: python -m py_compile src/pinterest_post.py
      - run: python src/pinterest_post.py --dry-run
