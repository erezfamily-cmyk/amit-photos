name: Apply Flower Curation HIDE Actions

on:
  push:
    branches: [main]
    paths:
      - 'data/flower-curation-actions-v1.json'
      - '.github/workflows/apply-flower-curation-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-hide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate reversible actions only
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/flower-curation-actions-v1.json',encoding='utf-8'))
          actions=p.get('actions',[])
          assert actions and len(actions)==4, actions
          assert all(a.get('action')=='HIDE' for a in actions), actions
          assert len({a['photo_id'] for a in actions})==len(actions)
          print('validated', len(actions), 'HIDE actions')
          PY

      - name: Build D1 SQL
        run: |
          python - <<'PY'
          import json
          actions=json.load(open('data/flower-curation-actions-v1.json',encoding='utf-8'))['actions']
          ids=[a['photo_id'] for a in actions]
          q=lambda s: "'" + s.replace("'","''") + "'"
          in_list=",".join(q(x) for x in ids)
          pairs=[]
          for x in ids:
              path='$."' + x.replace('"','\"') + '"'
              pairs.append(q(path))
              pairs.append("json_object('decision','HIDE','note','Applied by flower-curation pilot v1 after visual review; reversible.','updated_at',strftime('%Y-%m-%dT%H:%M:%fZ','now'))")
          sql=f"""UPDATE photos SET published=0 WHERE id IN ({in_list});
          INSERT INTO settings(key,value) VALUES('flower_curation_decisions_v1','{{}}')
          ON CONFLICT(key) DO NOTHING;
          UPDATE settings SET value=json_set(CASE WHEN json_valid(value) THEN value ELSE '{{}}' END,{','.join(pairs)})
          WHERE key='flower_curation_decisions_v1';
          """
          open('/tmp/flower-hide.sql','w',encoding='utf-8').write(sql)
          print(sql)
          PY

      - name: Apply HIDE directly to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute amit-photos-db --remote --file /tmp/flower-hide.sql

      - name: Purge public cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data '{"purge_everything":true}' > /tmp/purge.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/purge.json'))
          assert r.get('success') is True, r
          print('cache purge verified')
          PY

      - name: Verify D1 and public gallery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          IDS="'15h8IlkqnlorfEseEFBHjNikOSgMvsCQ_','1Tpaw2ooFcWip-poF5_tXOxN1K-PQHpWA','1yu2k9PJbstdauHCz0dVbM9QMNSiPR-lI','1PcDKeeJvmjYmuSALPGTVgclA0mmup8z7'"
          npx wrangler d1 execute amit-photos-db --remote --command "SELECT id,published FROM photos WHERE id IN (${IDS}) ORDER BY id" --json > /tmp/d1.json
          curl -fsS "https://amitphotos.com/api/photos?_curation_verify=$(date +%s)" > /tmp/public.json
          python - <<'PY'
          import json
          target={
            '15h8IlkqnlorfEseEFBHjNikOSgMvsCQ_',
            '1Tpaw2ooFcWip-poF5_tXOxN1K-PQHpWA',
            '1yu2k9PJbstdauHCz0dVbM9QMNSiPR-lI',
            '1PcDKeeJvmjYmuSALPGTVgclA0mmup8z7',
          }
          d1=json.load(open('/tmp/d1.json'))
          rows=[]
          for block in d1:
              rows.extend(block.get('results',[]))
          by_id={r['id']:int(r['published']) for r in rows}
          assert target == set(by_id), (target, by_id)
          assert all(by_id[x] == 0 for x in target), by_id
          public=json.load(open('/tmp/public.json'))
          public_ids={p['id'] for p in public}
          leaked=target & public_ids
          assert not leaked, f'HIDDEN photos still public: {sorted(leaked)}'
          print('verified: all 4 are published=0 and absent from public production')
          PY
