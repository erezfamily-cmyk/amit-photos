name: PayPal Orders v2 CI

on:
  pull_request:
    paths:
      - 'paypal-orders.js'
      - 'worker.js'
      - 'migrations/0001_paypal_orders_v2.sql'
      - 'migrations/0002_paypal_security_hardening.sql'
      - 'wrangler.paypal-sandbox.example.toml'
      - 'staging/paypal-sandbox-bootstrap.sql'
      - 'tests/paypal-orders-v2.test.mjs'
      - 'tests/digital-checkout.test.mjs'
      - 'assets/js/digital-checkout.mjs'
      - 'assets/js/gallery.js'
      - 'assets/js/i18n.js'
      - 'index.html'
      - 'tests/gallery-card-keyboard-a11y.test.mjs'
      - 'tests/i18n-translation-parity.test.mjs'
      - 'tests/purchase-disabled-ux.test.mjs'
      - 'checkout/index.html'
      - 'tests/paypal-staging-isolation.test.mjs'
      - 'tests/download-token-consumption.test.mjs'
      - 'tests/payments-feature-flag.test.mjs'
      - 'tests/paypal-sandbox-bootstrap-schema.test.mjs'
      - 'tests/paypal-migration-0002-rehearsal.test.mjs'
      - 'staging/rollback-0002-paypal-security-hardening.sql'
      - 'src/build_paypal_sandbox_config.py'
      - '.github/workflows/paypal-sandbox-staging.yml'
      - '.github/workflows/node-tests.yml'
  push:
    branches: [main]
    paths:
      - 'paypal-orders.js'
      - 'worker.js'
      - 'migrations/0001_paypal_orders_v2.sql'
      - 'migrations/0002_paypal_security_hardening.sql'
      - 'wrangler.paypal-sandbox.example.toml'
      - 'staging/paypal-sandbox-bootstrap.sql'
      - 'tests/paypal-orders-v2.test.mjs'
      - 'tests/digital-checkout.test.mjs'
      - 'assets/js/digital-checkout.mjs'
      - 'assets/js/gallery.js'
      - 'assets/js/i18n.js'
      - 'index.html'
      - 'tests/gallery-card-keyboard-a11y.test.mjs'
      - 'tests/i18n-translation-parity.test.mjs'
      - 'tests/purchase-disabled-ux.test.mjs'
      - 'checkout/index.html'
      - 'tests/paypal-staging-isolation.test.mjs'
      - 'tests/download-token-consumption.test.mjs'
      - 'tests/payments-feature-flag.test.mjs'
      - 'tests/paypal-sandbox-bootstrap-schema.test.mjs'
      - 'tests/paypal-migration-0002-rehearsal.test.mjs'
      - 'staging/rollback-0002-paypal-security-hardening.sql'
      - 'src/build_paypal_sandbox_config.py'
      - '.github/workflows/paypal-sandbox-staging.yml'
      - '.github/workflows/node-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paypal-orders-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PayPal Orders v2 security and isolation suite
        run: node --test tests/gallery-card-keyboard-a11y.test.mjs tests/i18n-translation-parity.test.mjs tests/purchase-disabled-ux.test.mjs tests/digital-checkout.test.mjs tests/paypal-orders-v2.test.mjs tests/paypal-staging-isolation.test.mjs tests/download-token-consumption.test.mjs tests/payments-feature-flag.test.mjs tests/paypal-sandbox-bootstrap-schema.test.mjs tests/paypal-migration-0002-rehearsal.test.mjs

