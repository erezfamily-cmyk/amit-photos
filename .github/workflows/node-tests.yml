name: Node Tests

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - 'tests/**'
      - '.github/workflows/node-tests.yml'
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - 'tests/**'
      - '.github/workflows/node-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node test suite
        run: node --test tests/*.test.mjs
