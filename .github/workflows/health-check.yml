name: בדיקת בריאות אתר

on:
  schedule:
    # Daily at 07:00 UTC: 10:00 Israel summer / 09:00 winter
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/health-check.yml'

permissions:
  contents: read

concurrency:
  group: production-health-check
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: בדיקת דף הבית
        id: homepage
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          CODE=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 -o /dev/null -w "%{http_code}" --max-time 15 https://amitphotos.com)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          if [ "$CODE" = "200" ]; then
            echo "✅ דף הבית: OK ($CODE)"
          else
            echo "❌ דף הבית: FAIL ($CODE)"
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      - name: בדיקת API תמונות
        id: api
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          RESPONSE=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 15 https://amitphotos.com/api/photos)
          COUNT=$(echo "$RESPONSE" | jq -er 'if type == "array" and length > 0 then length else error("Expected non-empty photo array") end')
          THUMB=$(echo "$RESPONSE" | jq -r '.[0].thumbnail // empty' 2>/dev/null || echo "")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "thumb=$THUMB" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt "0" ] 2>/dev/null; then
            echo "✅ API /api/photos: OK ($COUNT תמונות)"
          else
            echo "❌ API /api/photos: FAIL (תגובה לא תקינה)"
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      - name: בדיקת Sitemap
        id: sitemap
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          CODE=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 -o /dev/null -w "%{http_code}" --max-time 15 https://amitphotos.com/sitemap.xml)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          if [ "$CODE" = "200" ]; then
            echo "✅ Sitemap: OK ($CODE)"
          else
            echo "❌ Sitemap: FAIL ($CODE)"
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      - name: בדיקת תמונת דוגמה
        id: thumbnail
        env:
          THUMB: ${{ steps.api.outputs.thumb }}
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ -z "$THUMB" ]; then
            echo "❌ Thumbnail: FAIL (ה-API לא החזיר תמונה)"
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            case "$THUMB" in
              http://*|https://*) THUMB_URL="$THUMB" ;;
              /*) THUMB_URL="https://amitphotos.com$THUMB" ;;
              *) THUMB_URL="https://amitphotos.com/$THUMB" ;;
            esac
            CODE=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 -o /dev/null -w "%{http_code}" --max-time 15 "$THUMB_URL")
            echo "code=$CODE" >> $GITHUB_OUTPUT
            if [ "$CODE" = "200" ]; then
              echo "✅ Thumbnail: OK ($CODE) — $THUMB_URL"
            else
              echo "❌ Thumbnail: FAIL ($CODE) — $THUMB_URL"
              echo "failed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: בדיקת מסלולי הניסוי העסקי
        id: business
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail

          LIC=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 20 https://amitphotos.com/licensing/)
          grep -q 'licensing_personal_interest' <<<"$LIC"
          grep -q '/api/admin/prices' <<<"$LIC"
          grep -q 'G-XM6T3E8QWN' <<<"$LIC"
          echo "✅ /licensing/: page + pricing source + analytics marker"

          BIZ=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 20 https://amitphotos.com/business/)
          grep -q 'b2b_contact_start' <<<"$BIZ"
          grep -q 'amit_b2b_context' <<<"$BIZ"
          grep -q '/assets/js/analytics.js' <<<"$BIZ"
          echo "✅ /business/: funnel + context + analytics marker"

          ADMIN=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 20 https://amitphotos.com/admin.html)
          grep -q 'campaign-destination' <<<"$ADMIN"
          grep -q 'admin-campaign-links.mjs' <<<"$ADMIN"
          echo "✅ Admin UTM builder is present"

          STATUS=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 20 https://amitphotos.com/api/payments-status)
          ENABLED=$(echo "$STATUS" | jq -r '.enabled')
          if [ "$ENABLED" != "false" ]; then
            echo "❌ Payments guardrail breached: enabled=$ENABLED"
            exit 1
          fi
          echo "✅ PAYMENTS_ENABLED remains false"

      - name: סיכום
        if: ${{ always() }}
        env:
          HOMEPAGE_OUTCOME: ${{ steps.homepage.outcome }}
          HOMEPAGE_FAILED: ${{ steps.homepage.outputs.failed }}
          API_OUTCOME: ${{ steps.api.outcome }}
          API_FAILED: ${{ steps.api.outputs.failed }}
          SITEMAP_OUTCOME: ${{ steps.sitemap.outcome }}
          SITEMAP_FAILED: ${{ steps.sitemap.outputs.failed }}
          THUMBNAIL_OUTCOME: ${{ steps.thumbnail.outcome }}
          THUMBNAIL_FAILED: ${{ steps.thumbnail.outputs.failed }}
          BUSINESS_OUTCOME: ${{ steps.business.outcome }}
        run: |
          PASS=0
          FAIL=0
          echo "## Production health check" >> "$GITHUB_STEP_SUMMARY"
          for CHECK in HOMEPAGE API SITEMAP THUMBNAIL; do
            OUTCOME_VAR="${CHECK}_OUTCOME"
            FAILED_VAR="${CHECK}_FAILED"
            if [ "${!OUTCOME_VAR}" = "success" ] && [ "${!FAILED_VAR}" != "true" ]; then
              PASS=$((PASS+1))
              echo "- ✅ $CHECK" >> "$GITHUB_STEP_SUMMARY"
            else
              FAIL=$((FAIL+1))
              echo "- ❌ $CHECK (step: ${!OUTCOME_VAR})" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "HEALTH CHECK: $PASS/4 passed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$BUSINESS_OUTCOME" != "success" ]; then
            FAIL=$((FAIL+1))
            echo "- ❌ Business routes / payments guardrail" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ Business routes / PAYMENTS_ENABLED=false" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FAIL" -gt 0 ]; then
            echo "ACTION REQUIRED — $FAIL checks failed. Inspect step logs: runner/proxy errors alone do not establish a site outage." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
