name: בדיקת בריאות אתר

on:
  schedule:
    # כל יום ב-07:00 UTC = 10:00 ישראל
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: בדיקת דף הבית
        id: homepage
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://amitphotos.com)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          if [ "$CODE" = "200" ]; then
            echo "✅ דף הבית: OK ($CODE)"
          else
            echo "❌ דף הבית: FAIL ($CODE)"
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      - name: בדיקת API תמונות
        id: api
        run: |
          RESPONSE=$(curl -s --max-time 15 https://amitphotos.com/api/photos)
          COUNT=$(echo "$RESPONSE" | jq 'length' 2>/dev/null || echo "0")
          THUMB=$(echo "$RESPONSE" | jq -r '.[0].thumbnail // empty' 2>/dev/null || echo "")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "thumb=$THUMB" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt "0" ] 2>/dev/null; then
            echo "✅ API /api/photos: OK ($COUNT תמונות)"
          else
            echo "❌ API /api/photos: FAIL (תגובה לא תקינה)"
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      - name: בדיקת Sitemap
        id: sitemap
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://amitphotos.com/sitemap.xml)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          if [ "$CODE" = "200" ]; then
            echo "✅ Sitemap: OK ($CODE)"
          else
            echo "❌ Sitemap: FAIL ($CODE)"
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      - name: בדיקת תמונת דוגמה
        id: thumbnail
        run: |
          THUMB="${{ steps.api.outputs.thumb }}"
          if [ -z "$THUMB" ]; then
            echo "⚠️  Thumbnail: דולג (ה-API לא החזיר תמונה)"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            case "$THUMB" in
              http://*|https://*) THUMB_URL="$THUMB" ;;
              /*) THUMB_URL="https://amitphotos.com$THUMB" ;;
              *) THUMB_URL="https://amitphotos.com/$THUMB" ;;
            esac
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$THUMB_URL")
            echo "code=$CODE" >> $GITHUB_OUTPUT
            if [ "$CODE" = "200" ]; then
              echo "✅ Thumbnail: OK ($CODE) — $THUMB_URL"
            else
              echo "❌ Thumbnail: FAIL ($CODE) — $THUMB_URL"
              echo "failed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: בדיקת מסלולי הניסוי העסקי
        run: |
          set -euo pipefail

          LIC=$(curl -fsS --max-time 20 https://amitphotos.com/licensing/)
          grep -q 'licensing_personal_interest' <<<"$LIC"
          grep -q '/api/admin/prices' <<<"$LIC"
          grep -q 'G-XM6T3E8QWN' <<<"$LIC"
          echo "✅ /licensing/: page + pricing source + analytics marker"

          BIZ=$(curl -fsS --max-time 20 https://amitphotos.com/business/)
          grep -q 'b2b_contact_start' <<<"$BIZ"
          grep -q 'amit_b2b_context' <<<"$BIZ"
          grep -q '/assets/js/analytics.js' <<<"$BIZ"
          echo "✅ /business/: funnel + context + analytics marker"

          ADMIN=$(curl -fsSL --max-time 20 https://amitphotos.com/admin.html)
          grep -q 'campaign-destination' <<<"$ADMIN"
          grep -q 'admin-campaign-links.mjs' <<<"$ADMIN"
          echo "✅ Admin UTM builder is present"

          STATUS=$(curl -fsS --max-time 20 https://amitphotos.com/api/payments-status)
          ENABLED=$(echo "$STATUS" | jq -r '.enabled')
          if [ "$ENABLED" != "false" ]; then
            echo "❌ Payments guardrail breached: enabled=$ENABLED"
            exit 1
          fi
          echo "✅ PAYMENTS_ENABLED remains false"

      - name: סיכום
        run: |
          PASS=0
          FAIL=0

          [ "${{ steps.homepage.outputs.failed }}" = "true" ] && FAIL=$((FAIL+1)) || PASS=$((PASS+1))
          [ "${{ steps.api.outputs.failed }}" = "true" ] && FAIL=$((FAIL+1)) || PASS=$((PASS+1))
          [ "${{ steps.sitemap.outputs.failed }}" = "true" ] && FAIL=$((FAIL+1)) || PASS=$((PASS+1))
          if [ "${{ steps.thumbnail.outputs.skipped }}" = "true" ]; then
            echo "HEALTH CHECK: $PASS/3 עברו (בדיקת thumbnail דולגה)"
          elif [ "${{ steps.thumbnail.outputs.failed }}" = "true" ]; then
            FAIL=$((FAIL+1))
            echo "HEALTH CHECK: $PASS/4 עברו"
          else
            PASS=$((PASS+1))
            echo "HEALTH CHECK: $PASS/4 עברו"
          fi

          if [ "$FAIL" -gt "0" ]; then
            echo "❌ ACTION REQUIRED — $FAIL בדיקות נכשלו"
            exit 1
          else
            echo "✅ הכל תקין"
          fi
