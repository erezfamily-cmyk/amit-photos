name: 📱 הפצת סרטון באישור עמית

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Public HTTPS video URL on amitphotos.com (optional if using a repository file)'
        required: false
        type: string
      video_filename:
        description: 'Filename under video/ (optional if URL provided)'
        required: false
        type: string
      approved_sha256:
        description: 'SHA-256 of the exact MP4 reviewed by Amit'
        required: true
        type: string
      caption:
        description: 'Approved post text with clickable amitphotos.com link'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify approver and stage exact reviewed MP4
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_FILENAME: ${{ inputs.video_filename }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, re, sys, urllib.parse, urllib.request
          if os.environ['GITHUB_ACTOR'] != 'erezfamily-cmyk':
              sys.exit('Only Amit can approve publication')
          expected = os.environ['APPROVED_SHA256'].lower()
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              sys.exit('Invalid approved SHA-256')
          url, filename = os.environ['VIDEO_URL'], os.environ['VIDEO_FILENAME']
          if bool(url) == bool(filename):
              sys.exit('Supply exactly one of video_url or video_filename')
          if url:
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != 'https' or parsed.hostname != 'amitphotos.com':
                  sys.exit('Video URL must be HTTPS on amitphotos.com')
              with urllib.request.urlopen(url, timeout=120) as response:
                  data = response.read(101 * 1024 * 1024)
              if len(data) > 100 * 1024 * 1024:
                  sys.exit('Video exceeds 100 MB')
          else:
              root = pathlib.Path('video').resolve()
              path = (root / filename).resolve()
              if not path.is_relative_to(root) or not path.is_file() or path.suffix.lower() != '.mp4':
                  sys.exit('File must be an MP4 under video/')
              data = path.read_bytes()
          if hashlib.sha256(data).hexdigest() != expected:
              sys.exit('Video differs from the approved file')
          pathlib.Path('/tmp/approved-campaign.mp4').write_bytes(data)
          PY
      - name: Install distribution dependencies
        run: pip install requests google-api-python-client google-auth google-auth-oauthlib
      - name: Publish reviewed file
        env:
          CAPTION: ${{ inputs.caption }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python src/distribute_video.py --file /tmp/approved-campaign.mp4 --caption "$CAPTION"
      - name: Save distribution record
        run: |
          git config user.name "Distribute Agent"
          git config user.email "agent@amitphotos.com"
          git add data/distributed_videos.json
          git add data/videos.json || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Record approved video distribution"
          git pull --rebase origin main
          git push origin main
