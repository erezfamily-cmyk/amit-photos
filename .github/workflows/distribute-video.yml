name: 📱 הפצת סרטון לפלטפורמות

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL ציבורי לסרטון (מ-amitphotos.com/video/...)'
        required: false
        type: string
      video_filename:
        description: 'שם קובץ בתיקיית video/ בריפו (שימוש ידני בלבד)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת חבילות
        run: pip install requests google-api-python-client google-auth google-auth-oauthlib

      - name: הפצת הסרטון
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "${{ inputs.video_url }}" ]; then
            python src/distribute_video.py --url "${{ inputs.video_url }}"
          else
            python src/distribute_video.py --file "video/${{ inputs.video_filename }}"
          fi

      - name: שמירת נתוני הפצה
        run: |
          git config user.name "Distribute Agent"
          git config user.email "agent@amitphotos.com"
          git add data/distributed_videos.json
          git add data/videos.json || true
          if git diff --staged --quiet; then
            echo "אין שינויים"
            exit 0
          fi
          LABEL="${{ inputs.video_url || inputs.video_filename }}"
          git commit -m "📱 הפצת סרטון: ${LABEL##*/}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push נכשל (ניסיון $i)"
            sleep 5
          done
