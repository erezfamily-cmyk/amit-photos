name: Learn post gate CI

on:
  pull_request:
    paths:
      - 'src/learn_post_gate.py'
      - 'tests/test_learn_post_gate.py'
      - '.github/workflows/learn-generate.yml'
      - '.github/workflows/learn-post-gate-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/learn_post_gate.py'
      - 'tests/test_learn_post_gate.py'
      - '.github/workflows/learn-generate.yml'

permissions:
  contents: read

jobs:
  learn-post-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: python -m unittest tests.test_learn_post_gate -v
