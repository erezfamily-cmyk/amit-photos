name: עדכון תמונות אוטומטי

on:
  # כל יום ב-06:00 (UTC) = 09:00 ישראל
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-photos.yml'
      - 'src/sync_drive_curation.py'
      - 'scripts/push_generated_changes.sh'
  # הפעלה ידנית מה-GitHub Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Queued dispatches retain their event SHA; read current state after acquiring the lock.
          ref: main
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת חבילות
        run: pip install requests google-auth google-auth-oauthlib google-auth-httplib2 anthropic Pillow

      - name: סנכרון HIDE הפיך מול Google Drive
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WORKER_URL: https://amitphotos.com
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN }}
          PORTFOLIO_FOLDER_ID: ${{ secrets.PORTFOLIO_FOLDER_ID }}
          DRIVE_HIDDEN_FOLDER_ID: 1LxJF0lQecSZ5EFxTHu0Njr616CEaOmf5
        run: python src/sync_drive_curation.py

      - name: Persist Drive state before downstream processing
        if: always() && !cancelled()
        run: |
          git config user.name "Photos Agent"
          git config user.email "agent@amitphotos.com"
          git add -- data/drive-curation-state.json data/last_scan.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: checkpoint Drive curation state"
            bash scripts/push_generated_changes.sh
          fi

      - name: הרצת Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AMIT_PHOTO_AGENT }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN }}
          # ריק כברירת מחדל = נופל לחיפוש לפי שם "Portfolio" (כמו היום). להגדיר ל-ID
          # האמיתי של תיקיית Portfolio ב-Drive כדי לעקוף את החיפוש לגמרי.
          PORTFOLIO_FOLDER_ID: ${{ secrets.PORTFOLIO_FOLDER_ID }}
        run: |
          for attempt in 1 2 3; do
            python src/agent_photos.py && break
            if [ $attempt -lt 3 ]; then
              echo "ניסיון $attempt נכשל — ממתין 60 שניות..."
              sleep 60
            else
              echo "כל הניסיונות נכשלו"
              exit 1
            fi
          done

      - name: עדכן GOOGLE_TOKEN אחרי רענון
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f token_refreshed.json ] && [ -n "$GH_TOKEN" ]; then
            gh secret set GOOGLE_TOKEN < token_refreshed.json
            echo "✅ GOOGLE_TOKEN עודכן"
            rm token_refreshed.json
          fi

      - name: ייבוא תמונות חדשות ל-R2 ו-D1 (WebP)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WORKER_URL: https://amitphotos.com
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN }}
        run: python src/auto_import_new_photos.py

      - name: עדכון Sitemap
        run: python src/generate_sitemap.py

      - name: בדוק אם יש שינויים
        id: changes
        run: |
          git diff --quiet data/photos.json data/copyright_flagged.json data/drive-curation-state.json data/last_scan.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit ו-push אם יש תמונות חדשות
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Photos Agent"
          git config user.email "agent@amitphotos.com"
          git add data/photos.json sitemap.xml data/copyright_flagged.json data/drive-curation-state.json data/last_scan.json
          git commit -m "🤖 עדכון אוטומטי: תמונות חדשות מ-Google Drive"
          bash scripts/push_generated_changes.sh

      - name: Preserve Drive state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drive-curation-state-${{ github.run_id }}
          path: data/drive-curation-state.json
          retention-days: 7

      - name: עדכון גרסאות assets
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: python scripts/bump_versions.py

      - name: Deploy ל-Cloudflare
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf .git node_modules
          npx wrangler deploy

      - name: סנכרון GOOGLE_CREDENTIALS/GOOGLE_TOKEN ל-Cloudflare Worker secrets
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          echo "$GOOGLE_CREDENTIALS_JSON" | npx wrangler secret put GOOGLE_CREDENTIALS
          echo "$GOOGLE_TOKEN_JSON" | npx wrangler secret put GOOGLE_TOKEN

      - name: Cloudflare cache purge
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | python3 -c "import sys,json; r=json.load(sys.stdin); print('cache purged' if r.get('success') else f'purge failed: {r}')"

      - name: DB migrations (idempotent)
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          curl -s -X POST https://amitphotos.com/api/admin/migrate-photo-dimensions \
            -H "X-Admin-Password: ${ADMIN_PASSWORD}" | python3 -c "import sys,json; r=json.load(sys.stdin); print('DB migration:', r)"
