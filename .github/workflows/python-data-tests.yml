name: Python Data Tests

on:
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'tests/test_photo_strength_report.py'
      - '.github/workflows/python-data-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'tests/test_photo_strength_report.py'
      - '.github/workflows/python-data-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-data-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run photo data pipeline tests
        run: python tests/test_photo_strength_report.py
