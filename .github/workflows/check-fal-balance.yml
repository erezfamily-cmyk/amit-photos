name: 💰 בדיקת יתרת fal.ai

on:
  workflow_dispatch:

jobs:
  check-balance:
    runs-on: ubuntu-latest
    steps:
      - name: קריאה ל-Account Billing API
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          echo "== Authorization: Key =="
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" -H "Authorization: Key $FAL_KEY" "https://api.fal.ai/v1/account/billing?expand=credits"
          echo
          echo "== Authorization: Bearer =="
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" -H "Authorization: Bearer $FAL_KEY" "https://api.fal.ai/v1/account/billing?expand=credits"
