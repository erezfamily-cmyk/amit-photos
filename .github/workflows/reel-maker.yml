name: 🎬 יצירת Reel ידנית

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'קטגוריה (למשל: בעלי חיים / ישראל / פרחים וצמחים)'
        required: true
        type: string
      lang:
        description: 'שפת שקופית הסיום'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - he
          - en
      photos:
        description: 'IDs של תמונות ספציפיות (מופרדות בפסיק) — ריק = אקראי'
        required: false
        default: ''
        type: string
      post_to_instagram:
        description: 'פרסם ל-Instagram אחרי יצירה?'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  make-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-liberation

      - name: התקנת חבילות Python
        run: pip install requests pillow python-bidi fal-client boto3

      - name: יצירת הרילס
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          AMIT_PHOTO_AGENT: ${{ secrets.AMIT_PHOTO_AGENT }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          LANG_ARG=""
          if [ "${{ inputs.lang }}" != "auto" ]; then
            LANG_ARG="--lang ${{ inputs.lang }}"
          fi
          POST_ARG=""
          # אם לא נבחר לפרסם — מסיר credentials כדי למנוע פרסום אוטומטי
          if [ "${{ inputs.post_to_instagram }}" != "true" ]; then
            export INSTAGRAM_USER_ID=""
            export INSTAGRAM_PAGE_TOKEN=""
          fi
          PHOTOS_ARG=""
          if [ -n "${{ inputs.photos }}" ]; then
            PHOTOS_ARG="--photos ${{ inputs.photos }}"
          fi
          python src/reel_post.py --category "${{ inputs.category }}" $LANG_ARG $PHOTOS_ARG

      - name: שמור latest_reel.json לריפו
        run: |
          git config user.name "Reels Agent"
          git config user.email "agent@amitphotos.com"
          git add data/latest_reel.json
          if git diff --staged --quiet; then
            echo "אין שינויים"
          else
            git commit -m "🎬 latest_reel.json עודכן"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              sleep 5
            done
          fi

      - name: העלאת הסרטון כ-Artifact (גיבוי)
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.category }}
          path: reels_output/*.mp4
          retention-days: 7
          if-no-files-found: warn
