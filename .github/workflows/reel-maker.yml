name: 🎬 יצירת Reel ידנית

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'קטגוריה (למשל: בעלי חיים / ישראל / פרחים וצמחים) — לא נדרש אם publish_existing=true'
        required: false
        default: ''
        type: string
      lang:
        description: 'שפת שקופית הסיום'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - he
          - en
      photos:
        description: 'IDs של תמונות ספציפיות (מופרדות בפסיק) — ריק = אקראי'
        required: false
        default: ''
        type: string
      approved_sha256:
        description: 'לפרסום רילס קיים בלבד: SHA-256 של קובץ ה-MP4 שנצפה ואושר'
        required: false
        type: string
      prompts:
        description: 'JSON של פרומפטים מותאמים: [{"id":"...","prompt":"..."},...]'
        required: false
        default: ''
        type: string
      publish_existing:
        description: 'פרסם ל-Instagram את הרילס הקיים (reels_output/latest_reel.mp4) בלי ליצור חדש'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  make-reel:
    runs-on: ubuntu-latest

    steps:
      - name: אישור זהות וקובץ לפני פרסום
        env:
          PUBLISH_EXISTING: ${{ inputs.publish_existing }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          if [ "$PUBLISH_EXISTING" = "true" ]; then
            test "$GITHUB_ACTOR" = "erezfamily-cmyk" || { echo "Only Amit can approve publication"; exit 1; }
            [[ "$APPROVED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Provide the reviewed video's SHA-256"; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-liberation

      - name: התקנת חבילות Python
        run: pip install requests pillow python-bidi "fal-client<1.0.0" boto3

      - name: בדיקת זהות הסרטון המאושר
        if: inputs.publish_existing == true
        env:
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          echo "$APPROVED_SHA256  reels_output/latest_reel.mp4" | sha256sum --check --status || {
            echo "The existing reel differs from the reviewed video"; exit 1;
          }

      - name: יצירת הרילס
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          AMIT_PHOTO_AGENT: ${{ secrets.AMIT_PHOTO_AGENT }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_PASSWORD }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONUNBUFFERED: "1"
          REEL_PROMPTS: ${{ inputs.prompts }}
        run: |
          if [ "${{ inputs.publish_existing }}" == "true" ]; then
            python src/reel_post.py --publish-existing
            exit $?
          fi

          LANG_ARG=""
          if [ "${{ inputs.lang }}" != "auto" ]; then
            LANG_ARG="--lang ${{ inputs.lang }}"
          fi
          # יצירה תמיד טיוטה; פרסום רק בהרצה נפרדת עם SHA מאושר
          export INSTAGRAM_USER_ID=""
          export INSTAGRAM_PAGE_TOKEN=""
          PHOTOS_ARG=""
          if [ -n "${{ inputs.photos }}" ]; then
            PHOTOS_ARG="--photos ${{ inputs.photos }}"
          fi
          python src/reel_post.py --category "${{ inputs.category }}" $LANG_ARG $PHOTOS_ARG

      - name: שמור latest_reel לריפו
        if: inputs.publish_existing != true
        run: |
          git config user.name "Reels Agent"
          git config user.email "agent@amitphotos.com"
          [ -f reels_output/latest_reel.mp4 ] && git add reels_output/latest_reel.mp4
          [ -f data/latest_reel.json ]        && git add data/latest_reel.json
          if git diff --staged --quiet; then
            echo "אין שינויים"
          else
            git commit -m "🎬 רילס חדש — $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              sleep 5
            done
          fi

      - name: מזהה קובץ הטיוטה לבדיקה
        if: inputs.publish_existing != true
        run: |
          if [ -f reels_output/latest_reel.mp4 ]; then
            sha256sum reels_output/latest_reel.mp4 | tee reels_output/latest_reel.sha256
          fi

      - name: העלאת הסרטון כ-Artifact (גיבוי)
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.category }}
          path: |
            reels_output/*.mp4
            reels_output/latest_reel.sha256
          retention-days: 7
          if-no-files-found: warn
