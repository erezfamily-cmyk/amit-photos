name: 🎬 מילוי מזהי סרטוני YouTube חסרים

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fill-ids:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת חבילות
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - name: מילוי IDs
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python src/fill_video_ids.py

      - name: שמירת videos.json
        run: |
          git config user.name "Fill IDs Bot"
          git config user.email "agent@amitphotos.com"
          git add data/videos.json
          if git diff --staged --quiet; then
            echo "אין שינויים"
            exit 0
          fi
          git commit -m "🎬 מילוי אוטומטי של מזהי YouTube ב-videos.json"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push נכשל (ניסיון $i)"
            sleep 5
          done
