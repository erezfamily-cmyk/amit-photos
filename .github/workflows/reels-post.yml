name: Instagram Reel — approved video only

on:
  workflow_dispatch:
    inputs:
      approved_sha256:
        description: 'SHA-256 of reels_output/latest_reel.mp4 after reviewing the downloaded video'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-reviewed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify Amit approval
        env:
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          test "$GITHUB_ACTOR" = "erezfamily-cmyk" || { echo "Only Amit can approve publication"; exit 1; }
          [[ "$APPROVED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Invalid SHA-256"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact reviewed video
        env:
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          echo "$APPROVED_SHA256  reels_output/latest_reel.mp4" | sha256sum --check --status || {
            echo "Reel differs from reviewed copy"; exit 1;
          }
      - name: Install dependencies
        run: pip install requests anthropic pillow google-api-python-client google-auth google-auth-oauthlib
      - name: Publish approved existing reel
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.AMIT_PHOTO_AGENT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_PASSWORD }}
        run: python src/reel_post.py --publish-existing
      - name: Save publication record
        run: |
          git config user.name "Reels Agent"
          git config user.email "agent@amitphotos.com"
          git add data/reels_posted.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Record approved reel publication"
          git pull --rebase origin main
          git push origin main
