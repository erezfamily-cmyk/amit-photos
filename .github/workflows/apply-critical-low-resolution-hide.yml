name: Apply Critical Low Resolution HIDE

on:
  push:
    branches: [main]
    paths:
      - 'src/critical_low_resolution_hide.py'
      - '.github/workflows/apply-critical-low-resolution-hide.yml'
  pull_request:
    paths:
      - 'src/critical_low_resolution_hide.py'
      - 'tests/test_critical_low_resolution_hide.py'
      - '.github/workflows/apply-critical-low-resolution-hide.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile src/critical_low_resolution_hide.py
      - name: Tests
        run: python tests/test_critical_low_resolution_hide.py

  apply-hide:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install API runtime
        run: pip install requests

      - name: Read current owner decisions through Admin API
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          curl -fsS "https://amitphotos.com/api/admin/curation-decisions" \
            -H "X-Admin-Password: ${ADMIN_PASSWORD}" > /tmp/decisions.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/decisions.json'))
          assert isinstance(r.get('decisions'), dict), r
          print('owner decisions:', len(r['decisions']))
          PY

      - name: Build guarded reversible HIDE plan
        id: plan
        run: |
          python src/critical_low_resolution_hide.py --decisions-json /tmp/decisions.json
          cat /tmp/critical-low-resolution-plan.json
          ELIGIBLE=$(python -c "import json; print(json.load(open('/tmp/critical-low-resolution-plan.json'))['eligible_count'])")
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"

      - name: Apply guarded HIDE plan through Admin API
        if: steps.plan.outputs.eligible != '0'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, requests
          base='https://amitphotos.com'
          password=os.environ['ADMIN_PASSWORD']
          headers={'X-Admin-Password': password, 'Content-Type': 'application/json'}
          plan=json.load(open('/tmp/critical-low-resolution-plan.json'))
          applied=[]
          protected_late=[]
          for row in plan['eligible']:
              photo_id=row['photo_id']
              # Re-check owner decisions immediately before each mutation.
              cur=requests.get(base+'/api/admin/curation-decisions', headers={'X-Admin-Password': password}, timeout=20)
              cur.raise_for_status()
              decisions=cur.json().get('decisions', {})
              if (decisions.get(photo_id) or {}).get('decision'):
                  protected_late.append(photo_id)
                  continue

              patch=requests.patch(base+'/api/photos', headers=headers, json={'id': photo_id, 'published': False}, timeout=20)
              patch.raise_for_status()
              save=requests.post(base+'/api/admin/curation-decisions', headers=headers, json={
                  'photo_id': photo_id,
                  'decision': 'HIDE',
                  'note': 'Automatic critical low-resolution HIDE; reversible; Google Drive untouched.'
              }, timeout=20)
              if not save.ok:
                  # Roll back publication state because this photo had no prior owner decision.
                  rollback=requests.patch(base+'/api/photos', headers=headers, json={'id': photo_id, 'published': True}, timeout=20)
                  raise RuntimeError(f'decision save failed for {photo_id}: {save.status_code}; rollback={rollback.status_code}')
              applied.append(photo_id)

          json.dump({'applied': applied, 'protected_late': protected_late}, open('/tmp/applied.json','w'))
          print('applied', len(applied), 'late-protected', len(protected_late))
          PY

      - name: Purge public cache
        if: steps.plan.outputs.eligible != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data '{"purge_everything":true}' > /tmp/purge.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/purge.json'))
          assert r.get('success') is True, r
          print('cache purge verified')
          PY

      - name: Verify eligible IDs are absent from public gallery
        if: steps.plan.outputs.eligible != '0'
        run: |
          curl -fsS "https://amitphotos.com/api/photos?_critical_resolution_verify=$(date +%s)" > /tmp/public.json
          python - <<'PY'
          import json
          plan=json.load(open('/tmp/critical-low-resolution-plan.json'))
          applied=json.load(open('/tmp/applied.json')) if __import__('os').path.exists('/tmp/applied.json') else {'applied': []}
          public=json.load(open('/tmp/public.json'))
          public_ids={str(p['id']) for p in public}
          leaked=[photo_id for photo_id in applied['applied'] if photo_id in public_ids]
          assert not leaked, f'applied critical-resolution photos still public: {leaked}'
          print('verified public removal for', len(applied['applied']), 'photos')
          print('protected owner decisions:', plan['protected_count'] + len(applied.get('protected_late', [])))
          PY
