name: Apply Critical Low Resolution HIDE

on:
  push:
    branches: [main]
    paths:
      - 'src/critical_low_resolution_hide.py'
      - '.github/workflows/apply-critical-low-resolution-hide.yml'
  pull_request:
    paths:
      - 'src/critical_low_resolution_hide.py'
      - 'tests/test_critical_low_resolution_hide.py'
      - '.github/workflows/apply-critical-low-resolution-hide.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile src/critical_low_resolution_hide.py
      - name: Tests
        run: python tests/test_critical_low_resolution_hide.py

  apply-hide:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read current owner decisions from production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute amit-photos-db --remote --command "SELECT value FROM settings WHERE key='flower_curation_decisions_v1'" --json > /tmp/decisions.json

      - name: Build guarded reversible HIDE plan
        id: plan
        run: |
          python src/critical_low_resolution_hide.py --decisions-json /tmp/decisions.json
          cat /tmp/critical-low-resolution-plan.json
          ELIGIBLE=$(python -c "import json; print(json.load(open('/tmp/critical-low-resolution-plan.json'))['eligible_count'])")
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"

      - name: Apply guarded HIDE plan
        if: steps.plan.outputs.eligible != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute amit-photos-db --remote --file /tmp/critical-low-resolution-hide.sql

      - name: Purge public cache
        if: steps.plan.outputs.eligible != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data '{"purge_everything":true}' > /tmp/purge.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/purge.json'))
          assert r.get('success') is True, r
          print('cache purge verified')
          PY

      - name: Verify eligible IDs are absent from public gallery
        if: steps.plan.outputs.eligible != '0'
        run: |
          curl -fsS "https://amitphotos.com/api/photos?_critical_resolution_verify=$(date +%s)" > /tmp/public.json
          python - <<'PY'
          import json
          plan=json.load(open('/tmp/critical-low-resolution-plan.json'))
          public=json.load(open('/tmp/public.json'))
          public_ids={str(p['id']) for p in public}
          leaked=[x['photo_id'] for x in plan['eligible'] if x['photo_id'] in public_ids]
          assert not leaked, f'eligible critical-resolution photos still public: {leaked}'
          print('verified public removal for', plan['eligible_count'], 'eligible photos')
          print('protected owner decisions:', plan['protected_count'])
          PY
