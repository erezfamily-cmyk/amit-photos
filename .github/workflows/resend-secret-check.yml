name: Resend Secret Presence Check

on:
  push:
    branches:
      - fix-resend-binding
    paths:
      - '.github/workflows/resend-secret-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check RESEND_API_KEY presence
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "resend_secret=present"
          else
            echo "resend_secret=missing"
            exit 1
          fi
