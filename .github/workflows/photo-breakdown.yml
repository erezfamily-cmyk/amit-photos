name: 🎬 יצירת Breakdown Video

on:
  workflow_dispatch:
    inputs:
      photo_id:
        description: 'Photo ID מ-photos.json'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  make-breakdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת FFmpeg + פונטים
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-liberation

      - name: התקנת חבילות Python
        run: pip install requests pillow "fal-client<1.0.0" python-bidi google-auth google-auth-oauthlib

      - name: הגדרת Drive credentials + יצירת Breakdown Video
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GDRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
          GDRIVE_CREDS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p breakdown_output
          if [ -n "$GDRIVE_TOKEN" ]; then
            echo "$GDRIVE_TOKEN" > token.json
            echo "$GDRIVE_CREDS" > credentials.json
            echo "Drive credentials configured"
          else
            echo "No Drive credentials — using URL fallback"
          fi
          python src/photo_breakdown.py --id "${{ inputs.photo_id }}"

      - name: שמור breakdown_videos.json לריפו
        run: |
          git config user.name "Breakdown Agent"
          git config user.email "agent@amitphotos.com"
          [ -f data/breakdown_videos.json ] && git add data/breakdown_videos.json
          if git diff --staged --quiet; then
            echo "אין שינויים ב-JSON"
          else
            git commit -m "breakdown: $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              sleep 5
            done
          fi

      - name: שמור סרטון כ-Artifact
        uses: actions/upload-artifact@v4
        with:
          name: breakdown-${{ inputs.photo_id }}
          path: breakdown_output/*.mp4
          retention-days: 14
          if-no-files-found: warn
