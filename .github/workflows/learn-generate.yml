name: ניתוח צילום חדש — ניתוח תמונות

# Nothing is saved on the site or posted until the owner approves the run in GitHub (environment "social-approval")
# and only if the checks pass (real EXIF, subject position measured from the pixels). The analysis is generated as a
# dry run; on approval the publish job saves it (the /learn page goes live) and then posts to Facebook/Instagram.
# Manual run with mode "draft-only" prepares the draft and sends the approval e-mail but never posts.

on:
  schedule:
    - cron: '0 10 * * 4'  # שבועי — יום ה' 10:00 UTC (צומצם מ"כל יומיים" ב-19.7.2026, ראה feedback_instagram_performance)
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = prepare, wait for approval, publish; draft-only = prepare and e-mail only'
        type: choice
        options:
          - full
          - draft-only
        default: full

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.draft.outputs.publishable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת חבילות
        run: pip install requests pillow

      - name: ייצור ניתוח, בדיקות ושליחת בקשת אישור
        id: draft
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPROVAL_EMAIL: ${{ secrets.APPROVAL_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python src/learn_post_gate.py prepare

      - name: שמירת הטיוטה
        uses: actions/upload-artifact@v4
        with:
          name: learn-post-draft
          path: draft.json
          retention-days: 14

  publish:
    needs: prepare
    if: needs.prepare.outputs.publishable == 'true' && github.event.inputs.mode != 'draft-only'
    runs-on: ubuntu-latest
    environment: social-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת חבילות
        run: pip install requests pillow

      - name: הורדת הטיוטה שאושרה
        uses: actions/download-artifact@v4
        with:
          name: learn-post-draft

      - name: פרסום לרשתות אחרי אישור
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_PASSWORD }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python src/learn_post_gate.py publish
