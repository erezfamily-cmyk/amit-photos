name: Social Caption and Acquisition CI

on:
  pull_request:
    paths:
      - 'src/social_caption_quality.py'
      - 'src/instagram_post.py'
      - 'src/facebook_post.py'
      - 'src/reel_post.py'
      - 'src/ga_weekly_report.py'
      - 'tests/test_social_caption_quality.py'
      - 'tests/test_ga_weekly_report.py'
      - '.github/workflows/social-analytics-ci.yml'

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest requests anthropic
      - name: Caption and campaign regression tests (mocked APIs)
        run: python -m pytest -q tests/test_social_caption_quality.py tests/test_ga_weekly_report.py
